{% extends "base.html" %}
{% block title %}Shopping Cart{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0 fw-bold"><i class="bi bi-cart3 me-2 text-success"></i>Shopping Cart</h4>
    <a href="/marketplace" class="btn btn-outline-success btn-sm"><i class="bi bi-arrow-left me-1"></i>Continue Shopping</a>
</div>

<div class="row g-4">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header fw-semibold">Cart Items</div>
            <div class="card-body p-0">
                <div id="empty-cart" class="text-center py-5 text-muted d-none">
                    <i class="bi bi-cart-x display-4 d-block mb-2"></i>
                    Your cart is empty
                    <div class="mt-3"><a href="/marketplace" class="btn btn-success btn-sm">Browse Products</a></div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="cart-table">
                        <thead class="table-light">
                            <tr><th>Product</th><th>Type</th><th>Price</th><th>Qty</th><th>Total</th><th></th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header fw-semibold">Order Summary</div>
            <div class="card-body">
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Subtotal</span>
                    <span class="fw-semibold" id="summary-subtotal">Rs. 0</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Shipping</span>
                    <span class="fw-semibold">Rs. 50</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-3">
                    <span class="fw-bold">Total</span>
                    <span class="fw-bold text-success fs-5" id="summary-total">Rs. 0</span>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Delivery Address *</label>
                    <textarea class="form-control" id="shipping-address" rows="3" placeholder="Enter your full delivery address"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Phone Number *</label>
                    <input type="tel" class="form-control" id="phone-number" placeholder="Your contact number">
                </div>
                <div id="order-alert" class="alert d-none py-2 small"></div>
                <button class="btn btn-success w-100 fw-bold" onclick="placeOrder()">
                    <i class="bi bi-bag-check me-1"></i>Place Order
                </button>
            </div>
        </div>
    </div>
</div>

<script>
const token = localStorage.getItem('token');
let cart = JSON.parse(localStorage.getItem('cart') || '[]');

function renderCart() {
    const tbody = document.querySelector('#cart-table tbody');
    if (!cart.length) {
        document.getElementById('cart-table').classList.add('d-none');
        document.getElementById('empty-cart').classList.remove('d-none');
        updateSummary(0);
        return;
    }
    document.getElementById('cart-table').classList.remove('d-none');
    document.getElementById('empty-cart').classList.add('d-none');

    tbody.innerHTML = cart.map((item, idx) => `
        <tr>
            <td class="fw-semibold">${item.name}</td>
            <td>${item.item_type === 'preorder'
                ? '<span class="badge bg-warning text-dark">Pre-Order</span>'
                : '<span class="badge bg-success">Buy Now</span>'}</td>
            <td>${item.item_type === 'preorder' ? '<span class="text-muted small">TBD</span>' : 'Rs. ' + item.price_per_kg + '/' + (item.unit||'kg')}</td>
            <td><input type="number" class="form-control form-control-sm" style="width:75px" value="${item.quantity}" min="1" onchange="updateQty(${idx}, this.value)"></td>
            <td>${item.item_type === 'preorder' ? '-' : 'Rs. ' + (item.price_per_kg * item.quantity).toFixed(2)}</td>
            <td><button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="removeItem(${idx})"><i class="bi bi-trash"></i></button></td>
        </tr>`).join('');

    const subtotal = cart.filter(i => i.item_type !== 'preorder').reduce((s, i) => s + i.price_per_kg * i.quantity, 0);
    updateSummary(subtotal);
}

function updateQty(idx, qty) {
    cart[idx].quantity = parseFloat(qty) || 1;
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
}

function removeItem(idx) {
    cart.splice(idx, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
}

function updateSummary(subtotal) {
    document.getElementById('summary-subtotal').textContent = 'Rs. ' + subtotal.toFixed(2);
    document.getElementById('summary-total').textContent    = 'Rs. ' + (subtotal + 50).toFixed(2);
}

async function placeOrder() {
    if (!token) {
        document.getElementById('order-alert').className = 'alert alert-warning py-2 small';
        document.getElementById('order-alert').innerHTML = 'Please <a href="/login">login</a> to place an order.';
        return;
    }
    const address = document.getElementById('shipping-address').value.trim();
    const phone   = document.getElementById('phone-number').value.trim();
    if (!address) { showAlert('warning', 'Please enter your delivery address.'); return; }
    if (!phone)   { showAlert('warning', 'Please enter your phone number.'); return; }
    if (!cart.length) { showAlert('warning', 'Your cart is empty.'); return; }

    const subtotal = cart.filter(i => i.item_type !== 'preorder').reduce((s, i) => s + i.price_per_kg * i.quantity, 0);
    const items = cart.map(c => ({
        product_id: c.product_id,
        name: c.name,
        quantity: c.quantity,
        price: c.price_per_kg || 0,
        item_type: c.item_type || 'product'
    }));

    const res = await fetch('/api/marketplace/orders', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({
            items,
            total_amount: subtotal + 50,
            order_type: 'buy',
            shipping_address: address + ' | Phone: ' + phone
        })
    });
    const data = await res.json();
    if (res.ok) {
        localStorage.removeItem('cart');
        cart = [];
        showAlert('success', '✅ Order placed successfully! Redirecting to your orders…');
        setTimeout(() => window.location.href = '/marketplace/orders', 1800);
    } else {
        showAlert('danger', data.message || 'Order failed. Please try again.');
    }
}

function showAlert(type, msg) {
    const el = document.getElementById('order-alert');
    el.className = 'alert alert-' + type + ' py-2 small';
    el.innerHTML = msg;
}

// Pre-fill phone from stored user
const storedUser = JSON.parse(localStorage.getItem('user') || '{}');
if (storedUser.phone) document.getElementById('phone-number').value = storedUser.phone;

renderCart();
</script>
{% endblock %}
