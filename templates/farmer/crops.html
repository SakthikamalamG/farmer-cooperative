{% extends "base.html" %}
{% block title %}My Crops{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="mb-0 fw-bold"><i class="bi bi-clipboard-data me-2 text-success"></i>My Crops</h4>
        <p class="text-muted mb-0 small">Manage your crops and use AI tools</p>
    </div>
    <button class="btn btn-success" onclick="openAddCrop()">
        <i class="bi bi-plus-circle me-1"></i>Add Crop
    </button>
</div>

<!-- Crops Grid -->
<div class="row g-3 mb-5" id="crops-container">
    <div class="col-12 text-center text-muted py-4">
        <div class="spinner-border spinner-border-sm text-success me-2"></div>Loading crops…
    </div>
</div>

<!-- AI Tools -->
<div class="row g-4 mt-2">
    <div class="col-md-6" id="recommend">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white fw-semibold">
                <i class="bi bi-lightbulb me-1"></i>AI Crop Recommendation
            </div>
            <div class="card-body">
                <form id="recommend-form">
                    <div class="row g-2">
                        <div class="col-4"><input type="number" class="form-control form-control-sm" id="rec-n" placeholder="N (Nitrogen)" step="0.1"></div>
                        <div class="col-4"><input type="number" class="form-control form-control-sm" id="rec-p" placeholder="P (Phosphorus)" step="0.1"></div>
                        <div class="col-4"><input type="number" class="form-control form-control-sm" id="rec-k" placeholder="K (Potassium)" step="0.1"></div>
                        <div class="col-4"><input type="number" class="form-control form-control-sm" id="rec-temp" placeholder="Temp (°C)" step="0.1"></div>
                        <div class="col-4"><input type="number" class="form-control form-control-sm" id="rec-hum" placeholder="Humidity %" step="0.1"></div>
                        <div class="col-4"><input type="number" class="form-control form-control-sm" id="rec-ph" placeholder="pH" step="0.1"></div>
                        <div class="col-6"><input type="number" class="form-control form-control-sm" id="rec-rain" placeholder="Rainfall (mm)" step="0.1"></div>
                        <div class="col-3">
                            <select class="form-select form-select-sm" id="rec-soil">
                                <option value="loamy">Loamy</option>
                                <option value="clay">Clay</option>
                                <option value="sandy">Sandy</option>
                            </select>
                        </div>
                        <div class="col-3">
                            <select class="form-select form-select-sm" id="rec-season">
                                <option value="kharif">Kharif</option>
                                <option value="rabi">Rabi</option>
                                <option value="zaid">Zaid</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm w-100 mt-2">Get Recommendation</button>
                </form>
                <div id="recommend-result" class="mt-3"></div>
            </div>
        </div>
    </div>
    <div class="col-md-6" id="predict">
        <div class="card shadow-sm">
            <div class="card-header bg-info text-white fw-semibold">
                <i class="bi bi-graph-up me-1"></i>AI Price Prediction
            </div>
            <div class="card-body">
                <form id="predict-form">
                    <div class="row g-2">
                        <div class="col-6"><input type="text" class="form-control form-control-sm" id="pred-crop" placeholder="Crop Name"></div>
                        <div class="col-6"><input type="number" class="form-control form-control-sm" id="pred-yield" placeholder="Yield/acre" step="0.1"></div>
                        <div class="col-4"><input type="number" class="form-control form-control-sm" id="pred-rain" placeholder="Rainfall" step="0.1"></div>
                        <div class="col-4"><input type="number" class="form-control form-control-sm" id="pred-temp" placeholder="Temp" step="0.1"></div>
                        <div class="col-4"><input type="number" class="form-control form-control-sm" id="pred-hum" placeholder="Humidity" step="0.1"></div>
                        <div class="col-6"><input type="text" class="form-control form-control-sm" id="pred-region" placeholder="Region"></div>
                        <div class="col-6">
                            <select class="form-select form-select-sm" id="pred-grade">
                                <option value="A">Grade A</option>
                                <option value="B">Grade B</option>
                                <option value="C">Grade C</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-info btn-sm w-100 mt-2 text-white">Predict Price</button>
                </form>
                <div id="predict-result" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<!-- Add / Edit Crop Modal -->
<div class="modal fade" id="cropModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="cropModalTitle">Add New Crop</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-crop-id">
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label">Crop Name *</label>
                        <input type="text" class="form-control" id="crop-name" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Variety</label>
                        <input type="text" class="form-control" id="crop-variety">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Area (acres)</label>
                        <input type="number" class="form-control" id="crop-area" step="0.1">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Soil Type</label>
                        <select class="form-select" id="crop-soil">
                            <option>Loamy</option><option>Clay</option><option>Sandy</option><option>Red</option><option>Black</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Season</label>
                        <select class="form-select" id="crop-season">
                            <option>Kharif</option><option>Rabi</option><option>Zaid</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Yield Estimate (kg)</label>
                        <input type="number" class="form-control" id="crop-yield" step="0.1">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Planting Date</label>
                        <input type="date" class="form-control" id="crop-planting">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Expected Harvest</label>
                        <input type="date" class="form-control" id="crop-harvest">
                    </div>
                    <div class="col-12" id="status-row" style="display:none">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="crop-status">
                            <option value="growing">Growing</option>
                            <option value="harvested">Harvested</option>
                            <option value="failed">Failed</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" onclick="saveCrop()">Save Crop</button>
            </div>
        </div>
    </div>
</div>

<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = '/login';

async function loadCrops() {
    const res = await fetch('/api/farmer/crops', { headers: {'Authorization': 'Bearer ' + token} });
    if (res.status === 401 || res.status === 403) { window.location.href = '/login'; return; }
    const crops = await res.json();
    const container = document.getElementById('crops-container');
    if (!crops.length) {
        container.innerHTML = `
            <div class="col-12 text-center py-5">
                <i class="bi bi-clipboard-x display-4 text-muted d-block mb-2"></i>
                <p class="text-muted">No crops added yet.</p>
                <button class="btn btn-success btn-sm" onclick="openAddCrop()">
                    <i class="bi bi-plus-circle me-1"></i>Add Your First Crop
                </button>
            </div>`;
        return;
    }
    container.innerHTML = crops.map(c => `
        <div class="col-md-4 col-sm-6">
            <div class="card shadow-sm h-100" style="border-top:3px solid #198754">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h6 class="fw-bold mb-0">${c.crop_name} <small class="text-muted fw-normal">${c.variety || ''}</small></h6>
                        <span class="badge bg-${c.status === 'harvested' ? 'success' : c.status === 'failed' ? 'danger' : 'warning'}">${c.status}</span>
                    </div>
                    <div class="small text-muted">
                        ${c.area ? `<div><i class="bi bi-map me-1"></i>${c.area} acres</div>` : ''}
                        ${c.soil_type ? `<div><i class="bi bi-layers me-1"></i>${c.soil_type} soil</div>` : ''}
                        ${c.season ? `<div><i class="bi bi-sun me-1"></i>${c.season} season</div>` : ''}
                        ${c.yield_estimate ? `<div><i class="bi bi-bar-chart me-1"></i>Est. ${c.yield_estimate} kg</div>` : ''}
                        ${c.planting_date ? `<div><i class="bi bi-calendar me-1"></i>Planted: ${c.planting_date}</div>` : ''}
                        ${c.expected_harvest ? `<div><i class="bi bi-calendar-check me-1"></i>Harvest: ${c.expected_harvest}</div>` : ''}
                    </div>
                </div>
                <div class="card-footer bg-white border-0 pt-0 d-flex gap-2">
                    <button class="btn btn-outline-primary btn-sm flex-fill" onclick='openEditCrop(${JSON.stringify(c)})'>
                        <i class="bi bi-pencil me-1"></i>Edit
                    </button>
                    <button class="btn btn-outline-danger btn-sm flex-fill" onclick="deleteCrop('${c._id}')">
                        <i class="bi bi-trash me-1"></i>Delete
                    </button>
                </div>
            </div>
        </div>`).join('');
}

function openAddCrop() {
    document.getElementById('cropModalTitle').textContent = 'Add New Crop';
    document.getElementById('edit-crop-id').value = '';
    document.getElementById('crop-name').value    = '';
    document.getElementById('crop-variety').value = '';
    document.getElementById('crop-area').value    = '';
    document.getElementById('crop-soil').value    = 'Loamy';
    document.getElementById('crop-season').value  = 'Kharif';
    document.getElementById('crop-yield').value   = '';
    document.getElementById('crop-planting').value = '';
    document.getElementById('crop-harvest').value  = '';
    document.getElementById('status-row').style.display = 'none';
    new bootstrap.Modal(document.getElementById('cropModal')).show();
}

function openEditCrop(c) {
    document.getElementById('cropModalTitle').textContent  = 'Edit Crop';
    document.getElementById('edit-crop-id').value          = c._id;
    document.getElementById('crop-name').value             = c.crop_name || '';
    document.getElementById('crop-variety').value          = c.variety || '';
    document.getElementById('crop-area').value             = c.area || '';
    document.getElementById('crop-soil').value             = c.soil_type || 'Loamy';
    document.getElementById('crop-season').value           = c.season || 'Kharif';
    document.getElementById('crop-yield').value            = c.yield_estimate || '';
    document.getElementById('crop-planting').value         = c.planting_date || '';
    document.getElementById('crop-harvest').value          = c.expected_harvest || '';
    document.getElementById('status-row').style.display   = '';
    document.getElementById('crop-status').value           = c.status || 'growing';
    new bootstrap.Modal(document.getElementById('cropModal')).show();
}

async function saveCrop() {
    const name = document.getElementById('crop-name').value.trim();
    if (!name) { alert('Crop name is required'); return; }
    const id = document.getElementById('edit-crop-id').value;
    const payload = {
        crop_name:        name,
        variety:          document.getElementById('crop-variety').value,
        area:             document.getElementById('crop-area').value,
        soil_type:        document.getElementById('crop-soil').value,
        season:           document.getElementById('crop-season').value,
        yield_estimate:   document.getElementById('crop-yield').value,
        planting_date:    document.getElementById('crop-planting').value,
        expected_harvest: document.getElementById('crop-harvest').value,
        status:           document.getElementById('crop-status').value || 'growing'
    };
    const url    = id ? '/api/farmer/crops/' + id : '/api/farmer/crops';
    const method = id ? 'PUT' : 'POST';
    const res  = await fetch(url, {
        method,
        headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('cropModal')).hide();
        loadCrops();
    } else {
        alert(data.message || 'Failed to save crop');
    }
}

async function deleteCrop(id) {
    if (!confirm('Are you sure you want to delete this crop?')) return;
    const res = await fetch('/api/farmer/crops/' + id, {
        method: 'DELETE',
        headers: {'Authorization': 'Bearer ' + token}
    });
    if (res.ok) loadCrops();
    else alert('Failed to delete crop');
}

// AI Recommendation
document.getElementById('recommend-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = this.querySelector('button');
    btn.disabled = true; btn.textContent = 'Getting recommendation…';
    const payload = {
        nitrogen:    parseFloat(document.getElementById('rec-n').value) || 0,
        phosphorus:  parseFloat(document.getElementById('rec-p').value) || 0,
        potassium:   parseFloat(document.getElementById('rec-k').value) || 0,
        temperature: parseFloat(document.getElementById('rec-temp').value) || 0,
        humidity:    parseFloat(document.getElementById('rec-hum').value) || 0,
        ph:          parseFloat(document.getElementById('rec-ph').value) || 0,
        rainfall:    parseFloat(document.getElementById('rec-rain').value) || 0,
        soil_type:   document.getElementById('rec-soil').value,
        season:      document.getElementById('rec-season').value
    };
    const res  = await fetch('/api/ml/recommend-crop', {
        method: 'POST', headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });
    const data = await res.json();
    document.getElementById('recommend-result').innerHTML = data.all_recommendations
        ? data.all_recommendations.map((r, i) =>
            `<div class="alert alert-${i === 0 ? 'success' : 'secondary'} py-2 mb-1">
                ${i + 1}. <strong>${r.crop}</strong> — ${r.confidence}% confidence
            </div>`).join('')
        : '<div class="alert alert-danger py-2">Could not get recommendation</div>';
    btn.disabled = false; btn.textContent = 'Get Recommendation';
});

// AI Price Prediction
document.getElementById('predict-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = this.querySelector('button');
    btn.disabled = true; btn.textContent = 'Predicting…';
    const payload = {
        crop_name:      document.getElementById('pred-crop').value,
        yield_per_acre: parseFloat(document.getElementById('pred-yield').value) || 0,
        rainfall:       parseFloat(document.getElementById('pred-rain').value) || 0,
        temperature:    parseFloat(document.getElementById('pred-temp').value) || 0,
        humidity:       parseFloat(document.getElementById('pred-hum').value) || 0,
        region:         document.getElementById('pred-region').value,
        quality_grade:  document.getElementById('pred-grade').value
    };
    const res  = await fetch('/api/ml/predict-price', {
        method: 'POST', headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });
    const data = await res.json();
    document.getElementById('predict-result').innerHTML = data.predicted_price
        ? `<div class="alert alert-info py-2">
               Predicted Price: <strong>Rs. ${data.predicted_price}/kg</strong><br>
               Range: Rs. ${data.price_range.min} – Rs. ${data.price_range.max}
           </div>`
        : '<div class="alert alert-danger py-2">Could not predict price</div>';
    btn.disabled = false; btn.textContent = 'Predict Price';
});

loadCrops();
</script>
{% endblock %}
